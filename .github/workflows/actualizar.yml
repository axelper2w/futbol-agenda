name: Actualizador Automático de Partidos

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Guardar y publicar partidos.json
        run: |
          git config --global user.name "Bot Futbol"
          git config --global user.email "bot@github.com"
          git add partidos.json
          git commit -m "Actualización automática de partidos" || exit 0
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
